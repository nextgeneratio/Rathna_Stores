{% extends "base.html" %}

{% block title %}{% if is_edit %}Edit Address{% else %}Add Address{% endif %} — Rathna Stores{% endblock %}

{% block content %}
<section style="padding:var(--sp-12) 0;flex:1;">
  <div class="container" style="max-width:580px;">
    <div class="page-header" style="margin-bottom:2rem;">
      <div><h1>{% if is_edit %}Edit address{% else %}Add address{% endif %}</h1></div>
      <div class="page-header-actions">
        <a href="{% url 'customers:address_list' %}" class="btn btn-ghost">← Back</a>
      </div>
    </div>

    <form method="post"
          action="{% if is_edit %}{% url 'customers:address_edit' address_id=address.address_id %}{% else %}{% url 'customers:address_create' %}{% endif %}"
          novalidate>
      {% csrf_token %}
      <div class="form-card">
        <div class="form-grid">
          <div class="form-group full-width">
            <label class="form-label" for="recipient_name">
              Recipient name <span class="required" aria-hidden="true">*</span>
            </label>
            <input type="text" id="recipient_name" name="recipient_name" class="form-control"
                   value="{{ form_data.recipient_name|default:'' }}" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="phone_number">Phone number</label>
            <input type="tel" id="phone_number" name="phone_number" class="form-control"
                   value="{{ form_data.phone_number|default:'' }}" />
          </div>
          <div class="form-group full-width">
            <label class="form-label" for="address_line_1">
              Address line 1 <span class="required" aria-hidden="true">*</span>
            </label>
            <input type="text" id="address_line_1" name="address_line_1" class="form-control"
                   value="{{ form_data.address_line_1|default:'' }}" required />
          </div>
          <div class="form-group full-width">
            <label class="form-label" for="address_line_2">Address line 2</label>
            <input type="text" id="address_line_2" name="address_line_2" class="form-control"
                   value="{{ form_data.address_line_2|default:'' }}" />
          </div>
          <div class="form-group">
            <label class="form-label" for="city">
              City <span class="required" aria-hidden="true">*</span>
            </label>
            <input type="text" id="city" name="city" class="form-control"
                   value="{{ form_data.city|default:'' }}" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="district">District</label>
            <input type="text" id="district" name="district" class="form-control"
                   value="{{ form_data.district|default:'' }}" />
          </div>
          <div class="form-group">
            <label class="form-label" for="postal_code">Postal code</label>
            <input type="text" id="postal_code" name="postal_code" class="form-control"
                   value="{{ form_data.postal_code|default:'' }}" />
          </div>
          <div class="form-group full-width">
            <button type="button" id="use-location" class="btn btn-ghost btn-sm">Use my current location</button>
            <span id="location-status" class="form-hint" aria-live="polite"></span>
            <input type="hidden" id="latitude" name="latitude" value="{{ form_data.latitude|default:'' }}" />
            <input type="hidden" id="longitude" name="longitude" value="{{ form_data.longitude|default:'' }}" />
          </div>
          <div class="form-group">
            <label class="form-check" style="margin-top:1.5rem;">
              <input type="checkbox" name="is_default" value="1"
                {% if form_data.is_default %}checked{% endif %} />
              Set as default delivery address
            </label>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">
            {% if is_edit %}Save changes{% else %}Add address{% endif %}
          </button>
          <a href="{% url 'customers:address_list' %}" class="btn btn-ghost">Cancel</a>
        </div>
      </div>
    </form>
  </div>
</section>
{% endblock %}

{% block extra_js %}
<script>
  document.getElementById('use-location').addEventListener('click', () => {
    const status = document.getElementById('location-status');
    if (!navigator.geolocation) { status.textContent = 'Location sharing is not supported by this browser.'; return; }
    status.textContent = 'Requesting your location...';
    navigator.geolocation.getCurrentPosition((position) => {
      document.getElementById('latitude').value = position.coords.latitude.toFixed(7);
      document.getElementById('longitude').value = position.coords.longitude.toFixed(7);
      status.textContent = 'Location captured and will be saved with this address.';
    }, () => { status.textContent = 'Location permission was not granted.'; });
  });
</script>
{% endblock %}
