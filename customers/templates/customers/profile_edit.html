{% extends "base.html" %}
{% load static %}

{% block title %}Edit Profile — Rathna Stores{% endblock %}

{% block content %}
<section style="padding:var(--sp-12) 0;flex:1;">
  <div class="container" style="max-width:640px;">

    <div class="page-header" style="margin-bottom:2rem;">
      <div>
        <h1>Edit profile</h1>
      </div>
      <div class="page-header-actions">
        <a href="{% url 'customers:profile' %}" class="btn btn-ghost">← Cancel</a>
      </div>
    </div>

    <form method="post" action="{% url 'customers:profile_edit' %}" novalidate>
      {% csrf_token %}
      <div class="form-card">
        <h2 class="form-section-title">Personal details</h2>
        <div class="form-grid">
          <div class="form-group">
            <label class="form-label" for="first_name">
              First name <span class="required" aria-hidden="true">*</span>
            </label>
            <input type="text" id="first_name" name="first_name" class="form-control"
                   value="{{ form_data.first_name|default:'' }}"
                   autocomplete="given-name" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="last_name">
              Last name <span class="required" aria-hidden="true">*</span>
            </label>
            <input type="text" id="last_name" name="last_name" class="form-control"
                   value="{{ form_data.last_name|default:'' }}"
                   autocomplete="family-name" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="phone_number">Phone number</label>
            <input type="tel" id="phone_number" name="phone_number" class="form-control"
                   value="{{ form_data.phone_number|default:'' }}" autocomplete="tel" />
          </div>
          <div class="form-group">
            <label class="form-label" for="date_of_birth">Date of birth</label>
            <input type="date" id="date_of_birth" name="date_of_birth" class="form-control"
                   value="{{ form_data.date_of_birth|default:'' }}" />
            <span class="form-hint">Optional.</span>
          </div>
        </div>

        <h2 class="form-section-title" style="margin-top:2rem;">Notifications</h2>
        <div style="display:flex;flex-direction:column;gap:.5rem;">
          <label class="form-check">
            <input type="checkbox" name="email_notifications" value="1"
              {% if form_data.is_email_notifications_enabled %}checked{% endif %} />
            Email notifications
          </label>
          <label class="form-check">
            <input type="checkbox" name="sms_notifications" value="1"
              {% if form_data.is_sms_notifications_enabled %}checked{% endif %} />
            SMS notifications
          </label>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Save changes</button>
          <a href="{% url 'customers:profile' %}" class="btn btn-ghost">Cancel</a>
        </div>
      </div>
    </form>
  </div>
</section>
{% endblock %}
