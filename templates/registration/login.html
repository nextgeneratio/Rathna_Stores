{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staff Login — Rathna Stores</title>
  <link rel="stylesheet" href="{% static 'css/rathna.css' %}" />
</head>
<body>
  <main class="login-page">
    <div class="login-card">
      <div class="login-logo">Rathna Stores</div>
      <p class="login-subtitle">Staff access only</p>

      {% if form.errors %}
      <div class="alert alert-error" role="alert">
        Invalid username or password. Please try again.
      </div>
      {% endif %}

      <form method="post" novalidate>
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}" />

        <div class="form-group">
          <label class="form-label" for="id_username">Username</label>
          <input
            type="text"
            id="id_username"
            name="username"
            class="form-control"
            autocomplete="username"
            required
            autofocus
          />
        </div>

        <div class="form-group" style="margin-bottom:1.5rem;">
          <label class="form-label" for="id_password">Password</label>
          <input
            type="password"
            id="id_password"
            name="password"
            class="form-control"
            autocomplete="current-password"
            required
          />
        </div>

        <button type="submit" class="btn btn-primary">Sign in</button>
      </form>

      <p style="text-align:center;margin-top:1.5rem;">
        <a href="{% url 'cakes:catalogue' %}" style="color:var(--text-muted);font-size:.875rem;">
          ← Back to shop
        </a>
      </p>
    </div>
  </main>
</body>
</html>
